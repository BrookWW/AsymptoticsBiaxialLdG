name: Build and verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      kernel_replay:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lean build and theorem checks
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.kernel_replay && 240 || 120 }}
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
            sudo docker image prune -af
          fi
          df -h .
          available_kib="$(df -Pk . | awk 'NR==2 {print $4}')"
          test "$available_kib" -ge 20971520

      - name: Build Lean libraries
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          auto-config: "false"
          build: "true"
          use-mathlib-cache: "true"
          use-github-cache: "false"

      - name: Verify the exported theorems and their axiom closures
        shell: bash
        run: |
          audit_file="$(mktemp)"
          trap 'rm -f "$audit_file"' EXIT
          lake env lean -DwarningAsError=true --stdin <<'LEAN' | tee "$audit_file"
          import Thesis
          import Thesis.External.BoundaryHarmonicMaps
          import Thesis.External.GeometricMeasureTheory

          open Thesis

          example (a : BulkCoefficients) (M : ℝ) (hM : 0 < M) :
              BoundedEnergyLimitConclusion a M :=
            boundedEnergyLimit a M hM

          example (hSU : External.SU83BoundaryRegularity) :
              GlobalEnergyLimitAndCorrectionConclusion :=
            globalEnergyLimitAndCorrection_relative hSU

          example (hA19 : External.A19Prop31)
              (hAA : External.AllardAlmgrenLocalStructure) :
              LogarithmicEnergyLimitConclusion :=
            logarithmicEnergyLimit_relative hA19 hAA

          #print axioms Thesis.boundedEnergyLimit
          #print axioms Thesis.globalEnergyLimitAndCorrection_relative
          #print axioms Thesis.logarithmicEnergyLimit_relative
          LEAN
          python3 - "$audit_file" <<'PY'
          from pathlib import Path
          import re
          import sys

          expected = {
              "Thesis.boundedEnergyLimit",
              "Thesis.globalEnergyLimitAndCorrection_relative",
              "Thesis.logarithmicEnergyLimit_relative",
          }
          allowed_axioms = {"propext", "Classical.choice", "Quot.sound"}
          reports = re.findall(
              r"^'([^']+)' depends on axioms: \[([^]]*)\]$",
              Path(sys.argv[1]).read_text(),
              re.MULTILINE,
          )
          if len(reports) != len(expected) or {name for name, _ in reports} != expected:
              raise SystemExit("Expected one axiom report for each main theorem.")
          for name, axioms in reports:
              unexpected = {item.strip() for item in axioms.split(",") if item.strip()} - allowed_axioms
              if unexpected:
                  raise SystemExit(f"{name} uses unexpected axioms: {sorted(unexpected)}")
          PY

      - name: Check fixed dependency files
        run: git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json

      - name: Replay compiled declarations through the Lean kernel
        if: ${{ inputs.kernel_replay }}
        run: lake --no-build env leanchecker Thesis -v
